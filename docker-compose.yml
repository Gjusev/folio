# Full self-hosted stack:  docker compose --profile app up -d --build
# Dev services only:       pnpm services:up   (Postgres + compiler; run the web app with pnpm dev)
name: folio

services:
  db:
    # pgvector image (same Postgres 17) so RAG embeddings work; the pgdata
    # volume persists, so switching requires recreating the container:
    #   docker compose down db && docker compose up -d db
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: folio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 3s
      timeout: 3s
      retries: 60
    mem_limit: 512m
    restart: unless-stopped
    networks: [default]

  # Untrusted LaTeX runs here, never in the web process. See docs/architecture.md.
  compiler:
    build: ./services/latex-compiler
    environment:
      COMPILER_TOKEN: ${COMPILER_TOKEN:?set COMPILER_TOKEN in .env}
      MAX_CONCURRENT_JOBS: "2"
      JOB_TIMEOUT_MS: "45000"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped
    networks: [compile]

  # Optional live-collaboration relay (Yjs fan-out). Runs on the internal
  # network with no published port; the web app reaches it at ws://collab:3001
  # only when the operator sets COLLAB_URL (empty by default = feature off).
  # The browser, not the server, opens the WebSocket: in production put the
  # relay behind a same-origin wss:// reverse proxy or extend the CSP
  # connect-src (see .env.example).
  collab:
    build: ./services/collab
    environment:
      # Signs/verifies relay tokens; reuses COMPILER_TOKEN when unset.
      COLLAB_SECRET: ${COLLAB_SECRET:-}
      COMPILER_TOKEN: ${COMPILER_TOKEN}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    networks: [collab]

  web:
    profiles: [app]
    build: .
    # Tags the built image locally so it can be retagged/pushed for releases.
    image: folio:0.1.0
    environment:
      DATABASE_URL: postgres://folio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/folio
      COMPILER_URL: http://compiler:3001
      COMPILER_TOKEN: ${COMPILER_TOKEN}
      # Empty = collaboration off (default). The URL is handed to the browser,
      # so in the compose profile it must be ws://collab:3001 — which only
      # resolves inside the docker network; real deployments expose the relay
      # with a proxy and use a wss:// URL here.
      APP_URL: ${APP_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      COLLAB_URL: ${COLLAB_URL:-}
      COLLAB_SECRET: ${COLLAB_SECRET:-}
      # 0 closes self-registration (existing accounts keep logging in).
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_CREDENTIALS_KEY: ${LLM_CREDENTIALS_KEY:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      # Empty = grammar checking off. With the grammar profile: http://languagetool:8010
      LANGUAGETOOL_URL: ${LANGUAGETOOL_URL:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      db: { condition: service_healthy }
      compiler: { condition: service_started }
      collab: { condition: service_started }
    # Not read_only: Next writes to .next at runtime. Limits still cap a
    # compromised web process (memory, CPU, processes, privilege gains).
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [default, compile, collab]

  # Optional local model server (OpenAI-compatible at http://127.0.0.1:11434/v1).
  #   docker compose --profile ollama up -d ollama
  #   docker compose exec ollama ollama pull qwen3:0.6b
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks: [default]

  # Optional LanguageTool server for grammar checking (not a web dependency).
  #   docker compose --profile grammar up -d languagetool
  # pnpm dev on the host: LANGUAGETOOL_URL=http://127.0.0.1:8010
  # web container (--profile app): LANGUAGETOOL_URL=http://languagetool:8010
  # The first check after a start is slow (~30 s) while the JVM warms up.
  languagetool:
    profiles: [grammar]
    image: erikvl87/languagetool:6.8
    environment:
      Java_Xms: 256m
      Java_Xmx: 768m
    ports:
      - "127.0.0.1:8010:8010"
    mem_limit: 1g
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [default]

networks:
  default: {}
  # No route to the Internet: only the web app can reach the compiler.
  compile:
    internal: true
  # Same for the collab relay: it only listens.
  collab:
    internal: true

volumes:
  pgdata: {}
  ollama: {}
