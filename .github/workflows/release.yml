name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GHCR requires lowercase repository names; the owner login may contain
      # uppercase (e.g. "Gjusev").
      - name: Resolve image namespace
        run: echo "IMAGE_NS=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |-
            ghcr.io/${{ env.IMAGE_NS }}/folio:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_NS }}/folio:latest
      - name: Build and push compiler image
        uses: docker/build-push-action@v7
        with:
          context: ./services/latex-compiler
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |-
            ghcr.io/${{ env.IMAGE_NS }}/folio-compiler:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_NS }}/folio-compiler:latest
      - name: Build and push collab image
        uses: docker/build-push-action@v7
        with:
          context: ./services/collab
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |-
            ghcr.io/${{ env.IMAGE_NS }}/folio-collab:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_NS }}/folio-collab:latest

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog
        run: |
          node -e '
            const fs = require("fs");
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const sections = {};
            let current = null;
            for (const line of changelog.split("\n")) {
              const match = line.match(/^## \[(.+?)\]/);
              if (match) {
                current = match[1];
                sections[current] = [];
              } else if (current) {
                sections[current].push(line);
              }
            }
            let body = (sections[version] || []).join("\n").trim();
            if (!body) {
              console.warn(
                "::warning::No CHANGELOG section for [" +
                  version +
                  "]; falling back to Unreleased"
              );
              body = (sections["Unreleased"] || []).join("\n").trim();
            }
            fs.writeFileSync("release_body.md", body + "\n");
          '
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release_body.md
          generate_release_notes: false
